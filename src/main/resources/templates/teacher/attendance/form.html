<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="layout/head :: head('Школьная система')"></div>
</head>

<body>

<div th:insert="~{layout/base :: header}"></div>

<main class="container">

    <h1 class="page-title">Отметка посещаемости</h1>

    <form class="form-card"
          th:action="@{/teacher/attendance/save}"
          th:object="${attendance}"
          method="post">

        <div class="form-group">
            <label for="student">Ученик</label>
            <select id="student" th:field="*{student}" required>
                <option value="" disabled selected>Выберите ученика</option>
                <option th:each="s : ${students}"
                        th:value="${s.id}"
                        th:text="${s.name}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="subject">Предмет</label>
            <select id="subject" th:field="*{subject}" required>
                <option value="" disabled selected>Выберите предмет</option>
                <option th:each="s : ${subjects}"
                        th:value="${s.id}"
                        th:text="${s.name}">
                </option>
            </select>
        </div>

        <div class="form-group checkbox-group">
            <label>
                <input type="checkbox" th:field="*{present}">
                Присутствовал
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Сохранить</button>
            <a href="javascript:history.back()" class="btn-secondary">← Назад</a>
        </div>

    </form>

</main>
</body>
</html>
