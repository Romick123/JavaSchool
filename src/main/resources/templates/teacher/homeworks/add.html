<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="layout/head :: head('Школьная система')"></div>
</head>

<body>

<div th:insert="~{layout/base :: header}"></div>
<main class="auth-container">
    <div class="auth-card">

        <h2 class="auth-title">Задать домашнее задание</h2>

        <form th:action="@{/teacher/homework/save}"
              th:object="${homework}"
              method="post"
              class="auth-form">

            <label>
                Предмет
                <select name="subject.id">
                    <option th:each="s : ${subjects}"
                            th:value="${s.id}"
                            th:text="${s.name}">
                    </option>
                </select>
            </label>

            <label>
                Класс
                <select name="classRoom.id">
                    <option th:each="c : ${classes}"
                            th:value="${c.id}"
                            th:text="${c.name}">
                    </option>
                </select>
            </label>

            <label>
                Описание задания
                <textarea th:field="*{description}" rows="4"></textarea>
            </label>

            <label>
                Дата сдачи
                <input type="date" th:field="*{dueDate}">
            </label>

            <button type="submit" class="btn-primary">
                💾 Сохранить
            </button>

        </form>

        <a href="javascript:history.back()" class="btn-secondary">
            ← Назад
        </a>

    </div>
</main>
</body>
</html>
