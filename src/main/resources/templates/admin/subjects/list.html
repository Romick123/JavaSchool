<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="layout/head :: head('Предметы')"></div>
</head>
<body>

<div th:insert="~{layout/base :: header}"></div>

<div class="page">

    <div class="page-header">
        <h1>Предметы</h1>
        <a href="/admin/subjects/new" class="btn btn-primary">Добавить предмет</a>
    </div>

    <div th:if="${errorMessage}" style="color:red; margin-bottom:10px;">
        <p th:text="${errorMessage}"></p>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>Название</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="subject : ${subjects}">
            <td th:text="${subject.name}"></td>
            <td class="actions">
                <a th:href="@{/admin/subjects/edit/{id}(id=${subject.id})}"
                   class="btn btn-secondary">Изменить</a>
                <a th:href="@{/admin/subjects/delete/{id}(id=${subject.id})}"
                   class="btn btn-danger"
                   onclick="return confirm('Удалить предмет?')">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/home" class="btn btn-secondary" style="margin-top:20px;">Назад</a>

</div>
</body>
</html>
