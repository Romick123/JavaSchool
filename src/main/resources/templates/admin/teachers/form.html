<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="layout/head :: head('Учитель')"></div>
</head>

<body>

<div th:insert="~{layout/base :: header}"></div>

<main class="form-container">
    <div class="form-card">

        <h1 class="form-title">Учитель</h1>

        <form th:action="@{/admin/teachers/save}"
              th:object="${teacher}"
              method="post">

            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label>Имя</label>
                <input type="text" th:field="*{name}" required>
            </div>

            <div class="form-group">
                <label>Предметы</label>
                <select th:field="*{subjects}" multiple>
                    <option th:each="s : ${subjects}"
                            th:value="${s.id}"
                            th:text="${s.name}">
                    </option>
                </select>
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/teachers}" class="form-link">← Назад</a>
                <button type="submit" class="btn">Сохранить</button>
            </div>

        </form>
    </div>
</main>

</body>
</html>
