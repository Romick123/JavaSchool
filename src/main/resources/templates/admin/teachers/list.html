<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="layout/head :: head('Учителя')"></div>
</head>
<body>

<div th:insert="~{layout/base :: header}"></div>

<div class="page">

    <div class="page-header">
        <h1>Учителя</h1>
    </div>

    <div th:if="${errorMessage}" style="color:red; margin-bottom:10px;">
        <p th:text="${errorMessage}"></p>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>Имя</th>
            <th>Предметы</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="t : ${teachers}">
            <td th:text="${t.name}"></td>

            <td>
                <span th:if="${#lists.isEmpty(t.subjects)}">—</span>
                <span th:each="s : ${t.subjects}"
                      th:text="${s.name}"
                      style="display:inline-block;
                             background:#e5e7eb;
                             padding:4px 8px;
                             margin:2px;
                             border-radius:6px;
                             font-size:13px;">
                </span>
            </td>

            <td class="actions">
                <a th:href="@{/admin/teachers/edit/{id}(id=${t.id})}"
                   class="btn btn-secondary">Изменить</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/home" class="btn btn-secondary" style="margin-top:20px;">Назад</a>

</div>
</body>
</html>
