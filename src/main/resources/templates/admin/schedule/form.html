<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="layout/head :: head('Школьная система')"></div>
</head>

<body>

<div th:insert="~{layout/base :: header}"></div>

<main class="form-container">
    <div class="form-card">

        <h1 class="form-title">Добавление урока</h1>

        <form th:action="@{/admin/schedule/save}"
              th:object="${schedule}"
              method="post">

            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label>Класс</label>
                <select th:field="*{classRoom}">
                    <option th:each="c : ${classes}"
                            th:value="${c.id}"
                            th:text="${c.name}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>День недели</label>
                <select th:field="*{dayOfWeek}">
                    <option th:each="d : ${days}"
                            th:value="${d}"
                            th:text="${d}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Номер урока</label>
                <input type="number"
                       th:field="*{lessonNumber}"
                       min="1"
                       max="6">
            </div>

            <div class="form-group">
                <label>Предмет</label>
                <select th:field="*{subject}">
                    <option th:each="s : ${subjects}"
                            th:value="${s.id}"
                            th:text="${s.name}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Учитель</label>
                <select th:field="*{teacher}">
                    <option th:each="t : ${teachers}"
                            th:value="${t.id}"
                            th:text="${t.name}">
                    </option>
                </select>
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/schedule}" class="form-link">← Назад</a>
                <button type="submit" class="btn">Сохранить</button>
            </div>

        </form>
    </div>
</main>

</body>
</html>
