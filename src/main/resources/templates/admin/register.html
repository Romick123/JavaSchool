<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="layout/head :: head('Регистрация учителя')"></div>
</head>
<body>

<div th:insert="~{layout/base :: header}"></div>

<div class="page">

    <div class="page-header">
        <h1>Регистрация учителя</h1>
    </div>

    <form th:action="@{/admin/teachers/teacherRegister}" th:object="${user}" method="post" class="form-card">

        <h3>Данные для входа</h3>

        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="example@mail.com" required>
        </div>

        <div class="form-group">
            <label>Пароль</label>
            <input type="password" th:field="*{password}" placeholder="Пароль" required>
        </div>

        <!-- ===== TEACHER ===== -->
        <h3>Информация об учителе</h3>

        <div class="form-group">
            <label>Имя</label>
            <input type="text" name="teacher.name" placeholder="ФИО учителя" required>
        </div>

        <div class="form-group">
            <label>Предметы</label>
            <select name="subjects" multiple size="5">
                <option th:each="s : ${subjects}"
                        th:value="${s.id}"
                        th:text="${s.name}">
                </option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                Зарегистрировать
            </button>

            <a href="/home" class="btn btn-secondary">
                Назад
            </a>
        </div>

    </form>

</div>
</body>
</html>
