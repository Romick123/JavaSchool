<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="layout/head :: head('Школьная система')"></div>
</head>

<body>

<div th:insert="~{layout/base :: header}"></div>

<div class="page">

    <div class="page-header">
        <h2>Домашние задания</h2>
        <a th:href="@{/admin/homeworks/new}" class="btn btn-primary">Добавить</a>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>Класс</th>
            <th>Предмет</th>
            <th>Описание</th>
            <th>Сдать до</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="h : ${homeworks}">
            <td th:text="${h.classRoom.name}"></td>
            <td th:text="${h.subject.name}"></td>
            <td th:text="${h.description}"></td>
            <td th:text="${h.dueDate}"></td>
            <td class="actions">
                <a th:href="@{/admin/homeworks/edit/{id}(id=${h.id})}" class="btn btn-secondary">Изменить</a>
                <a th:href="@{/admin/homeworks/delete/{id}(id=${h.id})}" class="btn btn-danger">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/home" class="btn btn-secondary" style="margin-top:20px;">Назад</a>
</div>
</body>
</html>
