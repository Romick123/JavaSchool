<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="layout/head :: head('Школьная система')"></div>
</head>

<body>

<div th:insert="~{layout/base :: header}"></div>

<main class="form-container">
    <div class="form-card">

        <h1 class="form-title">Домашнее задание</h1>

        <form th:action="@{/admin/homeworks/save}"
              th:object="${homework}"
              method="post">

            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label>Класс</label>
                <select th:field="*{classRoom}">
                    <option th:each="c : ${classes}"
                            th:value="${c.id}"
                            th:text="${c.name}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Предмет</label>
                <select th:field="*{subject}">
                    <option th:each="s : ${subjects}"
                            th:value="${s.id}"
                            th:text="${s.name}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Задание</label>
                <textarea th:field="*{description}"
                          rows="4"></textarea>
            </div>

            <div class="form-group">
                <label>Дата сдачи</label>
                <input type="date" th:field="*{dueDate}">
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/homeworks}" class="form-link">← Назад</a>
                <button type="submit" class="btn">Сохранить</button>
            </div>

        </form>
    </div>
</main>

</body>
</html>
