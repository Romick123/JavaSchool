<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="layout/head :: head('Школьная система')"></div>
</head>

<body>

<div th:insert="~{layout/base :: header}"></div>

<main class="form-container">
    <div class="form-card">

        <h1 class="form-title">Оценка</h1>

        <form th:action="@{/admin/grades/save}"
              th:object="${grade}"
              method="post">

            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label>Ученик</label>
                <select th:field="*{student}">
                    <option th:each="s : ${students}"
                            th:value="${s.id}"
                            th:text="${s.name}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Предмет</label>
                <select th:field="*{subject}">
                    <option th:each="s : ${subjects}"
                            th:value="${s.id}"
                            th:text="${s.name}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Оценка</label>
                <input type="number"
                       th:field="*{grade_value}"
                       min="1"
                       max="5">
            </div>

            <div class="form-group">
                <label>Тип работы</label>
                <input type="text" th:field="*{typeOfWork}">
            </div>

            <div class="form-group">
                <label>Дата</label>
                <input type="date" th:field="*{date}">
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/grades}" class="form-link">← Назад</a>
                <button type="submit" class="btn">Сохранить</button>
            </div>

        </form>
    </div>
</main>
</body>
</html>
