<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <div th:replace="layout/head :: head('Школьная система')"></div>
</head>

<body>

<div th:insert="~{layout/base :: header}"></div>
<main class="auth-container">
    <div class="auth-card wide">

        <h2 class="auth-title" th:text="${student.name}"></h2>

        <p class="info-line">
            Класс:
            <b th:text="${student.classRoom.name}"></b>
        </p>

        <h3>📅 Посещаемость</h3>
        <table class="styled-table">
            <tr>
                <th>Дата</th>
                <th>Предмет</th>
                <th>Статус</th>
            </tr>
            <tr th:each="a : ${attendance}">
                <td th:text="${a.attendanceDate}"></td>
                <td th:text="${a.subject.name}"></td>
                <td th:text="${a.present ? '✔ Присутствовал' : '✖ Отсутствовал'}"></td>
            </tr>
        </table>

        <h3>📝 Оценки</h3>
        <table class="styled-table">
            <tr>
                <th>Дата</th>
                <th>Предмет</th>
                <th>Оценка</th>
            </tr>
            <tr th:each="g : ${grades}">
                <td th:text="${g.date}"></td>
                <td th:text="${g.subject.name}"></td>
                <td th:text="${g.grade_value}"></td>
            </tr>
        </table>

        <a href="javascript:history.back()" class="btn-secondary">
            ← Назад
        </a>

    </div>
</main>

</body>
</html>
